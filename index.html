<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--preto:#0A0A0A;--grafite:#1C1C1C;--chumbo:#2E2E2E;--branco:#F5F5F5;--prata:#B0B0B0;--vermelho:#E8002D;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,sans-serif;background:var(--preto);color:var(--branco);min-height:100vh}
#cb{position:sticky;top:0;z-index:200;background:var(--vermelho);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.cbl{color:#fff;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
.cbd{color:#fff;font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1;white-space:nowrap}
.pt{flex:1;height:6px;background:rgba(255,255,255,0.3);border-radius:99px;overflow:hidden}
.pf{height:100%;background:#fff;border-radius:99px;transition:width 1s ease}
.hero{background:var(--grafite);border-bottom:3px solid var(--vermelho);overflow:hidden;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0px,transparent 18px,rgba(255,255,255,0.025) 18px,rgba(255,255,255,0.025) 20px);pointer-events:none}
.hi{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:28px 20px 20px}
.escudo{width:80px;height:80px;filter:drop-shadow(0 4px 12px rgba(232,0,45,0.5));margin-bottom:12px}
.hn{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;color:#fff;line-height:1;text-align:center}
.hn .dest{color:var(--vermelho)}
.hsub{font-size:13px;color:var(--prata);margin-top:6px;text-align:center}
.mw{width:100%;overflow:hidden;margin-top:4px}
.ms{width:100%;max-width:380px;display:block;margin:0 auto}
.hs{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap;padding:0 16px 20px}
.hst{background:var(--preto);border:1px solid #333;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:800;color:var(--prata);text-align:center}
.hst .hv{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;line-height:1}
.ld{display:flex;gap:6px;padding:14px 16px;overflow-x:auto;background:var(--grafite);border-bottom:1px solid #333}
.li{display:flex;align-items:center;gap:6px;background:var(--chumbo);border-radius:8px;padding:6px 10px;white-space:nowrap;flex-shrink:0}
.ldot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.li span{font-size:11px;font-weight:700;color:var(--prata)}
.sl{padding:16px 16px 8px;font-size:11px;font-weight:800;color:var(--prata);text-transform:uppercase;letter-spacing:1.5px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
@media(min-width:560px){.sg{grid-template-columns:repeat(4,1fr)}}
@media(min-width:800px){.sg{grid-template-columns:repeat(6,1fr)}}
.sb{background:var(--grafite);border:2px solid #333;border-radius:var(--radius);padding:12px 8px;cursor:pointer;text-align:center;transition:all .18s;position:relative}
.sb:hover{transform:translateY(-2px);border-color:#555}
.sb.active{border-color:var(--vermelho);box-shadow:0 0 0 2px rgba(232,0,45,0.3)}
.sb .se{font-size:20px}.sb .sn{font-size:10px;font-weight:800;color:var(--vermelho);text-transform:uppercase;margin-top:3px}
.sb .snm{font-size:10px;font-weight:700;color:var(--branco);margin-top:2px;line-height:1.2}
.sb .sd{position:absolute;top:5px;right:5px;font-size:10px}
#det{padding:0 16px 32px;display:none}#det.visible{display:block}
.shdr{border-radius:var(--radius);padding:18px;margin-bottom:14px;background:var(--grafite);border-left:4px solid var(--vermelho)}
.shdr .stag{font-size:10px;font-weight:800;color:var(--vermelho);text-transform:uppercase;letter-spacing:1px}
.shdr h2{font-family:'Bebas Neue',sans-serif;font-size:22px;color:#fff;margin-top:4px}

.dtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.dtab{background:var(--grafite);border:1.5px solid #333;border-radius:8px;padding:7px 13px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;color:var(--prata);white-space:nowrap;transition:all .15s}
.mc{background:var(--grafite);border-radius:var(--radius);border:1px solid #333;overflow:hidden}
.mhdr{padding:14px 18px 12px;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;gap:10px}
.dbadge{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.fl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}

.mb{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.bt{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:var(--prata)}
.bt::before{content:'';display:block;width:3px;height:14px;border-radius:2px;background:var(--vermelho)}
.vl{display:flex;flex-direction:column;gap:7px}
.vi{display:flex;align-items:flex-start;gap:10px;background:var(--chumbo);border-radius:10px;padding:11px;text-decoration:none;transition:background .15s;border:1px solid #3a3a3a}
.vi:hover{background:#383838}
.vt{width:38px;height:38px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.vn .vtl{font-size:12px;font-weight:700;color:#fff}.vn .vm{font-size:10px;color:var(--prata);margin-top:2px}.vn .vc{font-size:10px;font-weight:800;margin-top:2px}
.al{display:block;background:var(--chumbo);border-radius:10px;padding:12px;text-decoration:none;border-left:3px solid var(--vermelho);transition:background .15s}
.al:hover{background:#383838}.al .at{font-size:13px;font-weight:700;color:#fff}.al .as{font-size:10px;color:var(--prata);margin-top:3px}
.espb{background:var(--chumbo);border-radius:10px;padding:14px;border-top:3px solid #F7B731}
.espb .etag{font-size:10px;font-weight:800;color:#F7B731;text-transform:uppercase;margin-bottom:6px}
.espb .etit{font-size:14px;font-weight:800;color:#fff;margin-bottom:6px}
.espb .etx{font-size:12px;color:var(--prata);line-height:1.6}.espb a{color:#F7B731;font-weight:700;text-decoration:none}
.redb{background:var(--chumbo);border-radius:10px;padding:14px;border-top:3px solid #00C9A7}
.redb .rtag{font-size:10px;font-weight:800;color:#00C9A7;text-transform:uppercase;margin-bottom:6px}
.redb .rtit{font-size:15px;font-weight:800;color:#fff;margin-bottom:6px}
.redb .rtx{font-size:12px;color:var(--prata);line-height:1.6}.redb a{color:#00C9A7;font-weight:700;text-decoration:none}
.exb{background:var(--chumbo);border-radius:10px;padding:14px;border-top:3px solid #A855F7}
.exb .xtag{font-size:10px;font-weight:800;color:#A855F7;text-transform:uppercase;margin-bottom:6px}
.exb .xtit{font-size:14px;font-weight:800;color:#fff;margin-bottom:6px}
.exb .xtx{font-size:12px;color:var(--prata);line-height:1.6}.exb a{color:#A855F7;font-weight:700;text-decoration:none}
.dsb{background:linear-gradient(135deg,#1a0a0a,#2a0a0a);border-radius:10px;padding:13px;border:1px solid rgba(232,0,45,0.3)}
.dsb .dtag{font-size:10px;font-weight:800;color:var(--vermelho);text-transform:uppercase;margin-bottom:4px}
.dsb .dtxt{font-size:13px;font-weight:700;color:#fff}
.cbtn{width:100%;padding:13px;border:2px solid #333;border-radius:10px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s;background:transparent;color:var(--prata)}
.cbtn.done{background:var(--vermelho);border-color:var(--vermelho);color:#fff}
.cbtn:hover:not(.done){border-color:#555;color:#fff}
footer{text-align:center;padding:24px 16px 40px;font-size:11px;color:#444;border-top:1px solid #1a1a1a}
footer b{color:var(--vermelho)}
</style>
</head>

  document.getElementById('dc').textContent=d;
  document.getElementById('dl').textContent=d===1?'dia':'dias';
  document.getElementById('pf').style.width=p.toFixed(1)+'%';
}

    var done=s.d.every(function(_,di){return isDone(i+'_'+di)});

    g.appendChild(b);
  });
}
